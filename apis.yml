aid: opus
name: Opus
description: >-
  OpusClip (Opus) is an AI video platform that turns long-form videos into
  short-form, viral clips and publishes them to social platforms. The OpusClip
  API lets developers submit a source video by URL or upload, create a clipping
  project, tune curation/import/render preferences, apply brand templates,
  retrieve exportable clips and transcripts, organize clips into collections,
  run censor and generative thumbnail jobs, and generate, publish, or schedule
  social posts to connected accounts. The API is REST over JSON at
  https://api.opus.pro, authenticated with a bearer API key, with HMAC-signed
  webhooks, page-based pagination, and a hosted MCP server plus an Agent Skill
  for agent-native access. API access is available on the Pro (Beta), Max, and
  Business plans.
